<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Infinity Puzzle Geometry Path -->
  <path d="M 170 180 C 110 180 70 216 70 256 C 70 296 110 332 170 332 C 235 332 277 256 277 256 C 277 256 319 180 384 180 C 444 180 484 216 484 256 C 484 296 444 332 384 332 C 319 332 277 256 277 256 C 277 256 235 180 170 180 Z"
        fill="none"
        stroke="url(#neonGrad)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Orbiting dots -->
  <circle cx="170" cy="180" r="14" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="384" cy="332" r="14" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="277" cy="256" r="10" fill="#a855f7" filter="url(#glow)" />
</svg>
